<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8f5">
  <title>Reset password · Dr. Bharati Pujari’s Clinic</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/config.js"></script>
  <script defer src="/assets/js/logic.js"></script>
  <script defer src="/assets/js/app.js"></script>
</head>
<body class="landing" data-page="reset-password">
  <header class="site-header">
    <a class="brand" href="/"><span class="brand-mark">b</span><span>Dr. Bharati<span class="brand-light"> Pujari’s Clinic</span></span></a>
    <a class="button button-quiet" href="/">Back to sign in</a>
  </header>
  <main class="password-page">
    <span class="eyebrow">ACCOUNT SECURITY</span>
    <h1>Set a new password</h1>
    <p>Choose a unique password with at least 12 characters.</p>
    <p id="password-recovery-message" class="form-message" role="status" aria-live="polite">Verifying your reset link…</p>
    <form id="password-recovery-form" hidden>
      <label class="field-label" for="new-password">New password</label>
      <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" required>
      <label class="field-label" for="confirm-password">Confirm new password</label>
      <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
      <button id="password-recovery-submit" class="button button-dark button-full" type="submit">Update password</button>
    </form>
  </main>
</body>
</html>
